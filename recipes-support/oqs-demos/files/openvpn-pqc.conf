port 1195
proto udp
dev tun

topology subnet
server 10.10.0.0 255.255.255.0

ca   /opt/oqs-demos/certs/pqc-ca-cert.pem
cert /opt/oqs-demos/certs/pqc-device-server-cert.pem
key  /opt/oqs-demos/certs/pqc-device-server-key.pem

dh none
tls-version-min 1.3
tls-groups mlkem768

cipher AES-256-GCM
auth SHA256

keepalive 10 60
persist-key
persist-tun
verb 5
