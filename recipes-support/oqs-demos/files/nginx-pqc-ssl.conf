server {

    listen 4433 ssl;

    ssl_certificate     /opt/oqs-demos/certs/pqc-device-cert.pem;
    ssl_certificate_key /opt/oqs-demos/certs/pqc-device-key.pem;

    ssl_protocols TLSv1.3;
    #ssl_ecdh_curve kyber768:X25519MLKEM768;
    ssl_ecdh_curve X25519MLKEM768:x25519_kyber768:p384_kyber768:x25519:secp384r1:kyber768:x448:secp256r1:secp521r1;

    location / {
        root   /var/www/localhost/html;
        index  index.html index.htm;
    }
}
