# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "oqs"
BBFILE_PATTERN_oqs := "^${LAYERDIR}/"
BBFILE_PRIORITY_oqs = "6"
LAYERSERIES_COMPAT_oqs = "scarthgap"
LAYERDEPENDS_oqs = "core openembedded-layer"
