header:
  version: 11
machine: "qemux86-64"
distro: nodistro
target:
  - oqs-demo-image
repos:
  # It's current revision will be used to perform the build.
  meta-oqs:
  openembedded-core:
    url: https://git.openembedded.org/openembedded-core.git
    branch: wrynose
    path: "layers/openembedded-core"
    layers:
      meta:
  bitbake:
    url: https://git.openembedded.org/bitbake.git
    branch: "2.18"
    path: "layers/bitbake"
    layers:
      bitbake: disabled
  meta-openembedded:
    url: "https://github.com/openembedded/meta-openembedded.git"
    branch: wrynose
    path: "layers/meta-openembedded"
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-perl:
      meta-python:
      meta-multimedia:
      meta-filesystems:
      meta-webserver:
  meta-freescale:
    url: "https://git.yoctoproject.org/git/meta-freescale.git"
    branch: master
    path: "layers/meta-freescale"
  meta-freescale-3rdparty:
    url: "https://github.com/Freescale/meta-freescale-3rdparty.git"
    branch: master
    path: "layers/meta-freescale-3rdparty"
  meta-raspberrypi:
    url: "https://git.yoctoproject.org/git/meta-raspberrypi.git"
    branch: master
    path: "layers/meta-raspberrypi"
    path: "layers/meta-stm32mp15x"
local_conf_header:
  standard: |
    CONF_VERSION = "2"
    INHERIT += "rm_work"
    DISTRO_FEATURES += "oqs"
    EXTRA_IMAGE_FEATURES = "allow-empty-password empty-root-password allow-root-login"
  sdk: |
    SDKMACHINE = "x86_64"
  license_flags: |
    LICENSE_FLAGS_ACCEPTED += "synaptics-killswitch"
    ACCEPT_FSL_EULA = "1"
